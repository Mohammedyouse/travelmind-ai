services:
  # ─────────────────────────────────────────────────────────────────────
  # 1. FastAPI Backend — Free Web Service on Render
  # ─────────────────────────────────────────────────────────────────────
  - type: web
    name: travelmind-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    # main:app calls create_app() at module level; direct uvicorn reference works.
    startCommand: "bash start.sh"
    healthCheckPath: /health
    autoDeploy: true

    envVars:
      # ── Application ──────────────────────────────────────────────────
      - key: APP_ENV
        value: production

      # ── Database (Neon PostgreSQL) ────────────────────────────────────
      # Set DATABASE_URL in the Render Dashboard → Environment section.
      # Format: postgresql+psycopg://user:password@host/dbname?sslmode=require
      - key: DATABASE_URL
        sync: false

      # ── Security ─────────────────────────────────────────────────────
      - key: JWT_SECRET_KEY
        generateValue: true

      # ── CORS ─────────────────────────────────────────────────────────
      # The production frontend origin; the app also allows *.vercel.app via regex.
      - key: CORS_ORIGINS
        value: "https://travelmind-ai-seven.vercel.app"

      # ── n8n Integration ──────────────────────────────────────────────
      - key: N8N_WEBHOOK_SECRET
        generateValue: true

      # ── AI / LLM ─────────────────────────────────────────────────────
      # Optional — set your Google Gemini key for live AI responses.
      - key: GEMINI_API_KEY
        sync: false

      # ── Amadeus Flight Intelligence ───────────────────────────────────
      - key: AMADEUS_CLIENT_ID
        sync: false
      - key: AMADEUS_CLIENT_SECRET
        sync: false
      - key: AMADEUS_BASE_URL
        value: https://test.api.amadeus.com

      # ── Stripe (optional — payments are mocked without this) ──────────
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false

      # ── Redis (optional — app degrades gracefully without it) ─────────
      # Render free tier does not include Redis; omit or use an external service.
      # - key: REDIS_URL
      #   sync: false
